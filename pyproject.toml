[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-discovery-crawler"
version = "0.1.0"
description = "Bounded public-documentation crawler with evidence-backed agent inventory"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "requests>=2.32.3,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "responses>=0.25,<1", "ruff>=0.9,<1", "cfn-lint>=1,<2"]

[project.scripts]
agent-crawler = "agent_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["agent_crawler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
